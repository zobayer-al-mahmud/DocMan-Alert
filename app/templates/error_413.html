<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Too Large - DocMan Alert</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='img/ananta_favicon.png') }}">
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <img src="{{ url_for('static', filename='img/ananta_logo_full.png') }}" alt="Ananta Companies" class="login-logo">
            <h4>File Too Large</h4>
            <div class="login-sub">DocMan Alert</div>

            <div class="alert alert-danger mt-3" style="text-align: left;">
                The file you tried to upload is larger than the allowed limit.
            </div>

            <p style="text-align: left; color: var(--text-muted); font-size: 14px;">
                <strong>Maximum file size:</strong> {{ max_mb }} MB<br>
                <strong>Allowed file types:</strong> {{ allowed_types }}
            </p>

            <p style="text-align: left; color: var(--text-muted); font-size: 14px;">
                Please compress the file or convert it to PDF, then try uploading again.
            </p>

            <a href="javascript:history.back()" class="btn btn-primary w-100 mt-2">Go Back</a>
        </div>
    </div>
</body>
</html>
